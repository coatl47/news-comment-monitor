name: Auto Update Naver Comment Data

on:
  schedule:
    # 30분마다 깨어나서, 이번 2시간 구간(KST 00·02·…·22시)을 아직 처리하지 않았을 때만 수집한다.
    # GitHub 예약 실행은 늦거나 빠지는 일이 잦아서, 정시 1회만 걸면 한 구간을 통째로 놓칠 수 있다.
    - cron: '5,35 * * * *'
  workflow_dispatch:        # GitHub에서 수동 버튼 클릭으로도 실행 가능

permissions:
  contents: write

concurrency:
  group: naver-dashboard-data-write
  cancel-in-progress: false

jobs:
  update-dashboard-data:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 필요 라이브러리 설치
        run: |
          pip install -r requirements.txt

      - name: 파이썬 문법 검사
        run: |
          python -m py_compile update_job.py naver_client.py collector.py analyzer.py aggregator.py

      - name: 데이터 업데이트 및 결과 저장
        env:
          PYTHONUNBUFFERED: "1"
          LOG_LEVEL: INFO
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openai/gpt-4o-mini
          OPENROUTER_BATCH_SIZE: 20
          OPENROUTER_TIMEOUT: 60
          TZ: Asia/Seoul
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # 1. 최신 코드 가져오기
          git pull --rebase origin main

          # 2. 데이터 업데이트 스크립트 실행 (예약 실행은 이미 처리한 구간이면 건너뜀, 수동 실행은 항상 수행)
          python update_job.py ${{ github.event_name == 'schedule' && '--skip-if-current' || '' }}

          # 3. 결과 저장
          git add data/
          git diff --staged --quiet || (git commit -m "Auto-update data $(date '+%Y-%m-%d %H:%M')" && git push)
